<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LibreSprite</title>
    <style>
      html, body, canvas {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        margin: 0; padding: 0;
      }
      body { overflow: hidden; background: #2b2b2b; font: 15px system-ui, sans-serif; }
      canvas { display: block; border: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #status {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
        display: flex; align-items: center; justify-content: center;
        padding: 16px; text-align: center; color: #eee; background: #2b2b2b;
      }
      #status[hidden] { display: none; }
      #keyboard { position: absolute; top: 0; right: 0; z-index: 1; height: 26px; padding: 0 12px; border: 0; background: #555; color: #fff; font: 14px system-ui, sans-serif; }
      @media (pointer: fine) { #keyboard { display: none; } }
    </style>
  </head>
  <body>
    <!-- The engine finds the canvas by its id -->
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <button id="keyboard">Keyboard</button>
    <div id="status">Loading…</div>
    <script src="config.js"></script>
    <script src="v/__VERSION__/bridge.js"></script>
  </body>
</html>
